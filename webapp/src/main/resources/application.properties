server.port=7600
server.ssl.bundle=server-bundle

# run management (actuator) on a separate port, same TLS bundle as the main server
management.server.port=17600
management.server.ssl.bundle=server-bundle

# configure monitoring endpoints
management.endpoints.enabled-by-default=false
management.endpoints.web.discovery.enabled=false

# explicitly enable endpoints
management.endpoint.info.enabled=true
management.endpoint.health.enabled=true
management.endpoint.health.show-details=always
management.endpoint.startup.enabled=true
management.endpoint.prometheus.enabled=true

# expose only liveness, readiness and database indicators for /actuator/health endpoint
management.health.defaults.enabled=false
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.db.enabled=true

# expose endpoints
management.endpoints.web.exposure.include=info,health,startup,prometheus

# enable tomcat.* metrics
server.tomcat.mbeanregistry.enabled=true

# Spring Data Repository Metrics
management.metrics.data.repository.autotime.enabled=true

# http.server.requests metrics
management.metrics.web.server.auto-time-requests=true

spring.datasource.url=jdbc:postgresql://localhost:7433/cdoc2rp
spring.datasource.username=docker
spring.datasource.password=docker
spring.datasource.driver-class-name=org.postgresql.Driver

app.smartid.client.hostUrl=https://sid.demo.sk.ee/smart-id-rp/v3/
app.smartid.client.statusPollTimeoutSeconds=1
spring.ssl.bundle.jks.sid-server.truststore.location=classpath:demo_server_trusted_ssl_certs.jks
spring.ssl.bundle.jks.sid-server.truststore.password=changeit
spring.ssl.bundle.jks.sid-server.truststore.type=jks

spring.ssl.bundle.jks.trusted-issuers.truststore.location=classpath:test_trusted_issuers.jks
spring.ssl.bundle.jks.trusted-issuers.truststore.password=changeit
spring.ssl.bundle.jks.trusted-issuers.truststore.type=jks

spring.ssl.bundle.jks.trusted-infra.truststore.location=classpath:cdoc2_infra_truststore.jks
spring.ssl.bundle.jks.trusted-infra.truststore.password=changeit
spring.ssl.bundle.jks.trusted-infra.truststore.type=jks

spring.ssl.bundle.jks.server-bundle.keystore.location=classpath:rp_server_localhost_keystore.p12
spring.ssl.bundle.jks.server-bundle.keystore.password=changeit
spring.ssl.bundle.jks.server-bundle.keystore.type=pkcs12
spring.ssl.bundle.jks.server-bundle.key.alias=rpServerLocalhostKey

app.mobileid.client.hostUrl=https://tsp.demo.sk.ee/mid-api
app.mobileid.client.statusPollTimeoutSeconds=1
spring.ssl.bundle.jks.mid-server.truststore.location=classpath:demo_server_trusted_ssl_certs.jks
spring.ssl.bundle.jks.mid-server.truststore.password=changeit
spring.ssl.bundle.jks.mid-server.truststore.type=jks

app.rp.name=DEMO
app.rp.sid.name=DEMO
app.rp.sid.uuid=00000000-0000-4000-8000-000000000000
app.rp.mid.name=DEMO
app.rp.mid.uuid=00000000-0000-0000-0000-000000000000
app.rp.scheme-name=smart-id-demo

app.restclient.auth-server.hostUrl=https://localhost:7500

# Expired session nonce removing job executes every 5 minutes every day
session-nonce.expired.clean-up.cron=0 0/5 * * * ?
session-nonce.expired.clean-up.delete-limit=1000
# Enable tracing (1.0 = 100% sampling)
# management.tracing.sampling.probability=1.0
# management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

# credentials for /actuator/prometheus api basic authentication
management.endpoints.metrics.username=username
management.endpoints.metrics.password=password