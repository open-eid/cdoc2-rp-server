logging.level.root=INFO
logging.level.ee.cyber.cdoc2=DEBUG

app.smartid.client.hostUrl=https://sid.demo.sk.ee/smart-id-rp/v3/

app.restclient.auth-server.hostUrl=https://localhost:8090

spring.ssl.bundle.jks.trusted-issuers.truststore.location=classpath:test_trusted_issuers.jks
spring.ssl.bundle.jks.trusted-issuers.truststore.password=changeit
spring.ssl.bundle.jks.trusted-issuers.truststore.type=jks

spring.ssl.bundle.jks.sid-server.truststore.location=classpath:demo_server_trusted_ssl_certs.jks
spring.ssl.bundle.jks.sid-server.truststore.password=changeit
spring.ssl.bundle.jks.sid-server.truststore.type=jks

spring.ssl.bundle.jks.trusted-infra.truststore.location=classpath:cdoc2_infra_truststore.jks
spring.ssl.bundle.jks.trusted-infra.truststore.password=changeit
spring.ssl.bundle.jks.trusted-infra.truststore.type=jks

app.mobileid.client.hostUrl=https://tsp.demo.sk.ee/mid-api
spring.ssl.bundle.jks.mid-server.truststore.location=classpath:demo_server_trusted_ssl_certs.jks
spring.ssl.bundle.jks.mid-server.truststore.password=changeit
spring.ssl.bundle.jks.mid-server.truststore.type=jks

app.rp.sid.name=DEMO
app.rp.sid.uuid=00000000-0000-4000-8000-000000000000
app.rp.mid.name=DEMO
app.rp.mid.uuid=00000000-0000-0000-0000-000000000000
app.rp.certificate-level=QUALIFIED
app.rp.scheme-name=smart-id-demo

app.countersign.ecPrivateKeyPem=rp-server-ec-key-2026-private.pem
app.well-known.publicKeys=ec-key-2025.pem,rp-server-ec-key-2026.pem
app.well-known.activePublicKey=rp-server-ec-key-2026.pem

# Expired session nonce removing job executes every 5 minutes every day
session-nonce.expired.clean-up.cron=0 0/5 * * * ?
session-nonce.expired.clean-up.delete-limit=1000